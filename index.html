
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K-12 Study Games</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #181818;
      color: white;
      font-family: Arial, sans-serif;
      min-height: 100vh;
    }

    /* =========================
       LOGIN LOCK SCREEN
       ========================= */

    .lock-screen {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 999999;
      background: #181818;
      justify-content: center;
      align-items: center;
    }

    .login-box {
      width: 340px;
      max-width: 90%;
      background: #252525;
      border-radius: 14px;
      padding: 30px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
      text-align: center;
    }

    .login-box img {
      width: 55px;
      height: 55px;
      object-fit: contain;
      margin-bottom: 10px;
    }

    .login-box h2 {
      margin: 0 0 8px;
      font-size: 24px;
    }

    .login-box p {
      color: #bbbbbb;
      font-size: 14px;
      margin-bottom: 22px;
    }

    .login-box input {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      background: #181818;
      color: white;
      border: 1px solid #444;
      border-radius: 7px;
      font-size: 15px;
      outline: none;
    }

    .login-box input:focus {
      border-color: #777;
    }

    .login-button {
      width: 100%;
      padding: 12px;
      background: #3a3a3a;
      color: white;
      border: none;
      border-radius: 7px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .login-button:hover {
      background: #505050;
    }

    .login-error {
      display: none;
      color: #ff5555;
      font-size: 14px;
      margin-top: 12px;
    }

    /* =========================
       TOP NAVIGATION BAR
       ========================= */

    .top-bar {
      height: 64px;
      width: 100%;
      background: #111111;
      display: flex;
      align-items: center;
      padding-left: 70px;
      gap: 28px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: white;
      font-size: 20px;
      font-weight: bold;
    }

    .brand img {
      width: 38px;
      height: 38px;
      object-fit: contain;
    }

    .contact {
      color: #ffffff;
      text-decoration: none;
      font-size: 16px;
      transition: color 0.2s;
    }

    .contact:hover {
      color: #aaaaaa;
    }

    /* =========================
       GAMES
       ========================= */

    .games-area {
      padding: 35px 0 0 70px;
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(2, 150px);
      gap: 22px;
    }

    .game {
      width: 150px;
      height: 150px;
      background: #252525;
      border-radius: 14px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition:
        transform 0.2s,
        box-shadow 0.2s,
        background 0.2s;
      overflow: hidden;
    }

    .game:hover {
      transform: translateY(-4px);
      background: #303030;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.7);
    }

    .game img {
      width: 105px;
      height: 105px;
      object-fit: contain;
    }

    /* =========================
       GAME OVERLAY
       ========================= */

    .game-overlay {
      display: none;
      position: fixed;
      z-index: 9999;
      inset: 0;
      background: #555555;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .game-window {
      position: relative;
      width: 90vw;
      height: 90vh;
      background: #000000;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
    }

    /* Header above iframe */

    .game-header {
      height: 45px;
      min-height: 45px;
      background: #222222;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding-right: 10px;
    }

    /* Close button */

    .close-button {
      background: transparent;
      border: none;
      color: red;
      font-size: 27px;
      font-weight: bold;
      cursor: pointer;
      line-height: 1;
      padding: 3px 8px;
      transition:
        color 0.2s,
        transform 0.2s;
    }

    .close-button:hover {
      color: #ff5555;
      transform: scale(1.1);
    }

    /* Iframe */

    .game-window iframe {
      width: 100%;
      flex: 1;
      border: none;
      display: block;
      background: black;
    }

    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 600px) {
      .top-bar {
        padding-left: 20px;
        gap: 18px;
      }

      .games-area {
        padding-left: 20px;
      }

      .games-grid {
        grid-template-columns: repeat(2, 130px);
      }

      .game {
        width: 130px;
        height: 130px;
      }

      .game-window {
        width: 95vw;
        height: 90vh;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       LOGIN LOCK SCREEN
       ========================= -->

  <div id="lockScreen" class="lock-screen">

    <div class="login-box">

      <img
        src="https://raw.githubusercontent.com/K-12Study/k-12study.github.io/refs/heads/main/favicon.ico"
        alt="K-12 Study Logo"
      >

      <h2>Site Locked</h2>

      <p>
        K-12 Study is currently locked.
        <br>
        Please log in to continue.
      </p>

      <input
        id="username"
        type="text"
        placeholder="Username"
        autocomplete="username"
      >

      <input
        id="password"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
      >

      <button
        class="login-button"
        onclick="login()"
      >
        Login
      </button>

      <div
        id="loginError"
        class="login-error"
      >
        Incorrect username or password.
      </div>

    </div>

  </div>


  <!-- =========================
       TOP BAR
       ========================= -->

  <nav class="top-bar">

    <a
      class="brand"
      href="https://k-12study.github.io"
    >

      <img
        src="https://raw.githubusercontent.com/K-12Study/k-12study.github.io/refs/heads/main/favicon.ico"
        alt="K-12 Study Logo"
      >

      <span>K-12 Study</span>

    </a>

    <a
      class="contact"
      href="https://k-12study.github.io/contact-us"
    >
      Contact Us
    </a>

  </nav>


  <!-- =========================
       GAMES
       ========================= -->

  <main class="games-area">

    <div class="games-grid">

      <!-- Geometry Dash -->

      <div
        class="game"
        onclick="openGame('https://lolygames.github.io/gd-lit')"
        title="Geometry Dash"
      >

        <img
          src="https://raw.githubusercontent.com/K-12Study/k-12study.github.io/refs/heads/main/images/Geometry_Dash_Icon.png"
          alt="Geometry Dash"
        >

      </div>


      <!-- Paper.io -->

      <div
        class="game"
        onclick="openGame('https://the-pizza-editionfree.github.io/lesson305/lesson-412/')"
        title="Baldi's"
      >

        <img
          src="https://raw.githubusercontent.com/K-12Study/k-12study.github.io/refs/heads/main/images/unnamed.png"
          alt="Baldi's Basics"
        >

      </div>


      <!-- Subway Surfers -->

      <div
        class="game"
        onclick="openGame('https://baldis-basics-online.github.io/g26/class-444/')"
        title="Subway Surfers"
      >

        <img
          src="https://raw.githubusercontent.com/K-12Study/k-12study.github.io/refs/heads/main/images/Subway%20Surfers.png"
          alt="Subway Surfers"
        >

      </div>

    </div>

  </main>


  <!-- =========================
       GAME POPUP
       ========================= -->

  <div
    id="gameOverlay"
    class="game-overlay"
    onclick="closeGame(event)"
  >

    <div class="game-window">

      <!-- X button is above the iframe -->

      <div class="game-header">

        <button
          class="close-button"
          onclick="closeGame()"
          aria-label="Close"
        >
          X
        </button>

      </div>

      <iframe
        id="gameFrame"
        src=""
        allowfullscreen
        allow="fullscreen; autoplay"
      ></iframe>

    </div>

  </div>


  <script>

    /* =========================
       LOGIN SETTINGS
       ========================= */

    const CORRECT_USERNAME = "admin";
    const CORRECT_PASSWORD = "123456";


    /* =========================
       CHECK LOCK TIME
       ========================= */

    function isLockedTime() {

      const now = new Date();

      const day = now.getDay();

      const hours = now.getHours();
      const minutes = now.getMinutes();

      const currentMinutes =
        hours * 60 + minutes;


      /*
        0 = Sunday
        1 = Monday
        2 = Tuesday
        3 = Wednesday
        4 = Thursday
        5 = Friday
        6 = Saturday
      */

      // Weekends are never locked.

      if (day === 0 || day === 6) {
        return false;
      }


      // 7:45 AM

      const lockStart = 7 * 60 + 45;


      // 2:45 PM

      const lockEnd = 14 * 60 + 45;


      return (
        currentMinutes >= lockStart &&
        currentMinutes < lockEnd
      );
    }


    /* =========================
       SHOW / HIDE LOCK SCREEN
       ========================= */

    function checkLock() {

      const lockScreen =
        document.getElementById("lockScreen");


      if (isLockedTime()) {

        lockScreen.style.display = "flex";

      } else {

        lockScreen.style.display = "none";
      }
    }


    /* =========================
       LOGIN
       ========================= */

    function login() {

      const username =
        document.getElementById("username").value;

      const password =
        document.getElementById("password").value;

      const error =
        document.getElementById("loginError");


      if (
        username === CORRECT_USERNAME &&
        password === CORRECT_PASSWORD
      ) {

        document.getElementById("lockScreen")
          .style.display = "none";

        error.style.display = "none";

      } else {

        error.style.display = "block";
      }
    }


    /* =========================
       ENTER KEY LOGIN
       ========================= */

    document.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Enter" &&
          document.getElementById("lockScreen")
            .style.display === "flex"
        ) {

          login();
        }

      }
    );


    /* =========================
       GAME FUNCTIONS
       ========================= */

    function openGame(url) {

      const overlay =
        document.getElementById("gameOverlay");

      const iframe =
        document.getElementById("gameFrame");

      iframe.src = url;

      overlay.style.display = "flex";
    }


    function closeGame(event) {

      /*
        Only close when clicking
        the gray area outside the game.
      */

      if (
        event &&
        event.target !==
          document.getElementById("gameOverlay")
      ) {

        return;
      }


      const overlay =
        document.getElementById("gameOverlay");

      const iframe =
        document.getElementById("gameFrame");

      iframe.src = "";

      overlay.style.display = "none";
    }


    /* =========================
       ESCAPE KEY
       ========================= */

    document.addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Escape") {

          closeGame();
        }

      }
    );


    /* =========================
       INITIAL LOCK CHECK
       ========================= */

    checkLock();


    /*
      Check every 30 seconds so the
      lock status updates automatically.
    */

    setInterval(
      checkLock,
      30000
    );

  </script>

</body>
</html>
