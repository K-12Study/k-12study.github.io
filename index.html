<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K-12 Study</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            text-align: center;
        }
        .btn {
            background-color: #4CAF50;
            border: none;
            color: white;
            padding: 15px 32px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 4px 2px;
            cursor: pointer;
            border-radius: 4px;
        }
        .btn-danger {
            background-color: #f44336;
        }
        .hidden {
            display: none !important;
        }
        #game-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: black;
            z-index: 9999;
            display: flex;
            flex-direction: column;
        }
        #game-container iframe {
            flex-grow: 1;
            border: none;
            width: 100%;
            height: 100%;
        }
        .controls {
            padding: 10px;
            background-color: #222;
            display: flex;
            justify-content: flex-end;
        }
        .lock-screen {
            background-color: #000;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10000;
        }
        .lock-screen input {
            padding: 10px;
            font-size: 16px;
            margin-bottom: 10px;
            border-radius: 4px;
            border: none;
        }
    </style>
</head>
<body>

    <div id="lock-screen" class="lock-screen hidden">
        <h2>This site is locked during school hours.</h2>
        <p>Enter password to unlock:</p>
        <input type="password" id="password-input" placeholder="Password">
        <button class="btn" onclick="checkPassword()">Unlock</button>
        <p id="error-msg" style="color: red; margin-top: 10px;"></p>
    </div>

    <div class="container" id="main-content">
        <h1>K-12 Study</h1>
        <button class="btn" onclick="openGame()">Play Run 3x3</button>
    </div>

    <div id="game-container" class="hidden">
        <div class="controls">
            <button class="btn btn-danger" onclick="closeGame()">Close Run 3x3</button>
        </div>
        <iframe id="game-frame" src=""></iframe>
    </div>

    <script>
        const CORRECT_PASSWORD = "deal1358";

        function checkTimeAndLock() {
            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes();
            const currentTimeInMinutes = (hours * 60) + minutes;
            const startTime = 465; 
            const endTime = 885;

            if (currentTimeInMinutes >= startTime && currentTimeInMinutes <= endTime) {
                if (sessionStorage.getItem("unlocked") !== "true") {
                    document.getElementById("lock-screen").classList.remove("hidden");
                }
            }
        }

        function checkPassword() {
            const userInput = document.getElementById("password-input").value;
            const errorMsg = document.getElementById("error-msg");

            if (userInput === CORRECT_PASSWORD) {
                sessionStorage.setItem("unlocked", "true");
                document.getElementById("lock-screen").classList.add("hidden");
            } else {
                errorMsg.innerText = "Incorrect password. Try again.";
            }
        }

        function openGame() {
            const iframe = document.getElementById("game-frame");
            iframe.src = "https://chompypotato.github.io/run3/";
            document.getElementById("game-container").classList.remove("hidden");
        }

        function closeGame() {
            const iframe = document.getElementById("game-frame");
            iframe.src = ""; 
            document.getElementById("game-container").classList.add("hidden");
        }

        checkTimeAndLock();
    </script>
</body>
</html>
