<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/x-icon" href="https://githubusercontent.com">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - K-12 Study</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 60px;
            background-color: #1e1e1e;
            display: flex;
            align-items: center;
            padding: 0 20px;
            box-sizing: border-box;
            border-bottom: 1px solid #333;
            z-index: 999;
        }
        .nav-logo-link {
            display: flex;
            align-items: center;
            margin-right: 20px;
        }
        .nav-logo {
            height: 35px;
            width: 35px;
            cursor: pointer;
        }
        .nav-link {
            color: #ffffff;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
        }
        .nav-link:hover {
            color: #4CAF50;
        }
        .container {
            text-align: center;
            margin-top: 60px;
            width: 100%;
            max-width: 400px;
            padding: 20px;
            box-sizing: border-box;
        }
        .contact-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            text-align: left;
        }
        .form-group label {
            margin-bottom: 5px;
            font-size: 14px;
            color: #b3b3b3;
        }
        .form-group input, .form-group textarea {
            padding: 12px;
            font-size: 16px;
            border-radius: 4px;
            border: 1px solid #333;
            background-color: #1e1e1e;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }
        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: #4CAF50;
        }
        .btn {
            background-color: #4CAF50;
            border: none;
            color: white;
            padding: 15px 32px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin-top: 10px;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
        }
        .btn:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

    <!-- Exact Same Navbar Structure -->
    <div class="navbar">
        <!-- Clickable Logo leading back home -->
        <a href="https://github.io" class="nav-logo-link">
            <img class="nav-logo" src="https://raw.githubusercontent.com/K-12Study/k-12study.github.io/refs/heads/main/favicon.ico" alt="Logo">
        </a>
        <a class="nav-link" href="https://github.io/contact">Contact</a>
    </div>

    <!-- Contact Form Container -->
    <div class="container">
        <h1>Contact Us</h1>
        
        <!-- Replace 'your-email@example.com' with your actual email address -->
        <form class="contact-form" action="https://formspree.io/f/xwlpoyed" method="POST">
            
            <div class="form-group">
                <label for="name">Your Name</label>
                <input type="text" id="name" name="name" placeholder="John Doe" required>
            </div>

            <div class="form-group">
                <label for="email">Your Email</label>
                <input type="email" id="email" name="_replyto" placeholder="name@school.com" required>
            </div>

            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" name="message" rows="5" placeholder="Type your message here..." required></textarea>
            </div>

            <button type="submit" class="btn">Send Email</button>
        </form>
    </div>

</body>
</html>
